[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "MTCWorldMJX"
version = "0.1.0"
description = "MetaWorld manipulation environments implemented with MuJoCo MJX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.0",
    "flax>=0.8.0",
    "mujoco-mjx[warp]~=3.10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "gymnasium>=1.1",
    "scipy>=1.4.1",
    "imageio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["MTCWorldMJX*"]

[tool.setuptools.package-data]
MTCWorldMJX = ["assets/**"]
